name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test
        run: pwsh -File tests/smoke.ps1

      - name: ClamAV adapter test (mock clamd)
        run: pwsh -File tests/clamd.ps1

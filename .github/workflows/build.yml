name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test
        run: pwsh -File tests/smoke.ps1

      - name: ClamAV adapter test (mock clamd)
        run: pwsh -File tests/clamd.ps1

      - name: Real-time decision test
        run: pwsh -File tests/realtime.ps1

      - name: Build GUI
        run: dotnet build gui/Feather.Gui.csproj -c Release

      - name: Upload scanner and GUI
        uses: actions/upload-artifact@v4
        with:
          name: feather-windows
          path: |
            build/Release/feather.exe
            build/Release/feathersvc.exe
            gui/bin/Release/net8.0-windows/Feather.exe

  installer:
    runs-on: windows-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build scanner
        run: cmake --build build --config Release

      - name: Build GUI
        run: dotnet build gui/Feather.Gui.csproj -c Release

      - name: Install Inno Setup
        run: winget install --id JRSoftware.InnoSetup -e --silent --accept-package-agreements --accept-source-agreements

      - name: Build installer
        run: pwsh -ExecutionPolicy Bypass -File installer/build.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: feather-installer
          path: installer/output/feather-setup-*.exe
